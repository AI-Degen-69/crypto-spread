# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  collapse_walkthrough: true

  # Repository PR-title format (canonical: docs/git-workflow.md §3)
  # Overrides global ~/.agents/config/coderabbit/ vocabulary to use Conventional Commits.
  auto_title_instructions: >-
    Title format: "<type>(<scope>): <imperative summary> (#<issue>)".
    Type must be one of: feat, fix, docs, test, chore, refactor, perf, ci, style, revert.
    Scope is optional (e.g., strategy, dash, backtest, trading, skills, docs, workflow).
    The trailing number is the GitHub issue number being addressed (e.g. #392), not the PR number.

  # Enforce Conventional Commits: a PR whose title does not match this format
  # cannot merge (request_changes_workflow blocks on error-level checks).
  # custom_checks lives in the SAME mapping — a duplicate key would silently
  # drop one of the two (CodeRabbit #7572).
  pre_merge_checks:
    title:
      mode: error
      requirements: >-
        Title must follow the Conventional Commits format:
        "<type>(<scope>): <imperative summary> (#<issue>)" where type is one of:
        feat, fix, docs, test, chore, refactor, perf, ci, style, revert.
        Scope is optional in parentheses. Summary is concise. The title must end
        with the issue number in parentheses like "(#123)". Do not reject titles
        for using valid types, scopes, standard abbreviations, or technical identifiers.
    custom_checks:
      - name: "No Hardcoded Secrets"
        mode: "error"
        instructions: "Fail if any private keys, Polymarket API keys, or wallet seed phrases appear in the diff."

  # Secret scanning on every review (Polymarket / wallet keys).
  tools:
    betterleaks:
      enabled: true
    trufflehog:
      enabled: true

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!run/**"
    - "!**/*.jsonl"
    - "!**/*.csv"
    - "!**/*.log"
    - "!**/.pytest_cache/**"

  path_instructions:
    - path: "strategy/**/*.py"
      instructions: |
        Trading engine rules:
        - NEVER suggest changing tick sizes, price rounding, lot sizes, or exchange constants.
        - NEVER suggest adding new external dependencies to requirements.txt.
        - Ensure all network calls and parsing have strict error handling (no bare except).
    - path: "scripts/**/*.py"
      instructions: |
        - Replay & tick collectors: respect network timeouts and avoid unbounded retry loops.
        - Do not change output formats or tick schema without explicit instructions.
    - path: "tests/**/*.py"
      instructions: |
        - Ensure all unit tests are hermetic and mock external network calls.
        - Use pytest conventions.

  finishing_touches:
    custom:
      - name: "Risk Score"
        instructions: "Rate risk 1-5 (1=safe/cosmetic, 5=high risk trading logic) with one sentence rationale."
